plugins {
    id 'java'
    id 'org.asciidoctor.jvm.gems.classic' version '5.1.0'
    id 'org.asciidoctor.jvm.convert.classic' version '5.1.0' apply false
    id 'org.asciidoctor.jvm.pdf.classic' version '5.1.0'
    id 'org.asciidoctor.jvm.epub.classic' version '5.1.0'
    id 'se.patrikerdes.use-latest-versions' version '0.2.19'
    id 'io.github.ben-manes.versions' version '0.66.0'
}

repositories {
    mavenCentral()
    ruby {
        gems()
    }
}

/**
 * Take the version in version.txt as version for the project
 */
version = file('version.txt').text.trim()

asciidoctorj {
    version = '3.0.1'
    requires file('src/main/ruby/asciidoctor-pdf-extensions.rb')
    modules {
        pdf {
            version '2.3.19'
        }
        epub {
            version '1.5.1'
        }
    }
}

import org.asciidoctor.gradle.jvm.AsciidoctorTask

def attrs = ['sourcedir'         : '../../../main/webapp',
             'source-highlighter': 'rouge',
             'epub3-stylesdir'   : './styles/epub',
             // NOTE don't include leading ./ because it messes up paths in the epub files
             'imagesdir'         : 'images',
             'toc'               : 'left',
             'icons'             : 'font',
             'sectanchors'       : '',
             'idprefix'          : '',
             'idseparator'       : '-',
             'listing-caption'   : 'Listing']

tasks.withType(AsciidoctorTask) { task ->
    attributes attrs
    sourceDir 'src/docs/asciidoc/modules/ROOT'
    baseDirFollowsSourceDir()
    sources {
        include 'index.adoc'
    }
}

tasks.register('html', AsciidoctorTask) {
    description = 'Generates single page HTML'
    outputDir = layout.buildDirectory.dir('asciidoc/html5')
    outputOptions {
        backends 'html5'
    }
}

tasks.register('prepress', AsciidoctorTask) {
    description = 'Generates PDF for prepress printing'
    attributes attrs + ['media': 'prepress', 'pdfmarks': '', 'pdf-theme': 'prepress', 'source-highlighter': '']
    outputDir = layout.buildDirectory.dir('asciidoc/pdf-prepress')
    outputOptions {
        backends 'pdf'
        setSeparateOutputDirs false
    }
}

tasks.register('pdf', AsciidoctorTask) {
    description = 'Generates PDF for download'
    attributes attrs + ['pdfmarks': '']
    outputDir = layout.buildDirectory.dir('asciidoc/pdf-screen')
    outputOptions {
        backends 'pdf'
        setSeparateOutputDirs false
    }
}

// Rouge doesn't work in EPUB, so use CodeRay
tasks.register('epub', AsciidoctorTask) {
    description = 'Generates EPUB3'
    attributes attrs + ['source-highlighter': 'coderay']
    outputDir = layout.buildDirectory.dir('asciidoc/epub3')
    outputOptions {
        backends 'epub3'
    }
}

tasks.named('pdf') { shouldRunAfter 'html' }
tasks.named('prepress') { shouldRunAfter 'pdf' }
tasks.named('epub') { shouldRunAfter 'prepress' }

tasks.register('all') {
    dependsOn 'html', 'pdf', 'prepress', 'epub'
}

defaultTasks 'all'
